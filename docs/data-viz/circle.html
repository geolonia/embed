<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>データ駆動の円 + @geolonia/embed</title>
  <style>
    body { margin: 0; padding: 16px; font-family: sans-serif; }
    .geolonia { width: 100%; height: 480px; }
    pre { background: #f5f5f5; padding: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>データ駆動の円</h1>
  <p>ポイントの円の大きさを <code>weight</code>、色を <code>category</code> プロパティの値で変えます。<code>category</code> は文字列なので、値ごとに別の色になります。</p>
  <p>データはシード固定の乱数で作った合成データで、実在の施設や統計ではありません。</p>

  <div
    class="geolonia"
    data-marker="off"
    data-geojson="./sample-spots.geojson"
    data-circle-size="weight"
    data-circle-color="category"
  ></div>

  <pre><code>&lt;div
  class="geolonia"
  data-marker="off"
  data-geojson="./sample-spots.geojson"
  data-circle-size="weight"
  data-circle-color="category"
&gt;&lt;/div&gt;</code></pre>

  <script src="../embed?geolonia-api-key=YOUR-API-KEY"></script>
</body>
</html>
