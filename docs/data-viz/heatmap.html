<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ヒートマップ + @geolonia/embed</title>
  <style>
    body { margin: 0; padding: 16px; font-family: sans-serif; }
    .geolonia { width: 100%; height: 480px; }
    pre { background: #f5f5f5; padding: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>ヒートマップ</h1>
  <p>ポイントを <code>weight</code> プロパティの値を重みにしたヒートマップで描きます。重みを使わないときは <code>data-heatmap="on"</code> と書きます。</p>
  <p>データはシード固定の乱数で作った合成データで、実在の施設や統計ではありません。</p>

  <div
    class="geolonia"
    data-marker="off"
    data-geojson="./sample-spots.geojson"
    data-heatmap="weight"
    data-heatmap-colors="#FABF3D,#FFAB40,#EA5C0D,#B3261E"
  ></div>

  <pre><code>&lt;div
  class="geolonia"
  data-marker="off"
  data-geojson="./sample-spots.geojson"
  data-heatmap="weight"
  data-heatmap-colors="#FABF3D,#FFAB40,#EA5C0D,#B3261E"
&gt;&lt;/div&gt;</code></pre>

  <script src="../embed?geolonia-api-key=YOUR-API-KEY"></script>
</body>
</html>
